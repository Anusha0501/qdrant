<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="denseGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="sparseGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>
    <linearGradient id="qdrantGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1000" height="560" fill="#F8FAFC"/>
  <text x="500" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#0F172A">
    Hybrid Search Architecture — EU/UK Regulatory Corpus
  </text>

  <!-- Source doc -->
  <rect x="40" y="90" width="180" height="80" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="130" y="122" text-anchor="middle" font-size="14" fill="#1E293B" font-weight="600">EUR-Lex / GDPR /</text>
  <text x="130" y="140" text-anchor="middle" font-size="14" fill="#1E293B" font-weight="600">AI Act / UK DPA</text>
  <text x="130" y="158" text-anchor="middle" font-size="12" fill="#475569">chunked passages</text>

  <line x1="220" y1="130" x2="300" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Query box -->
  <rect x="40" y="330" width="180" height="70" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="130" y="360" text-anchor="middle" font-size="14" fill="#1E293B" font-weight="600">User Query</text>
  <text x="130" y="378" text-anchor="middle" font-size="12" fill="#475569">"Article 22 GDPR..."</text>

  <line x1="220" y1="365" x2="300" y2="230" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="220" y1="365" x2="300" y2="440" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Dense embedding box -->
  <rect x="300" y="160" width="230" height="140" rx="14" fill="url(#denseGrad)"/>
  <text x="415" y="192" text-anchor="middle" font-size="16" font-weight="700" fill="white">Dense Embedding</text>
  <text x="415" y="216" text-anchor="middle" font-size="12" fill="#E0E7FF">FastEmbed / Cohere</text>
  <text x="415" y="234" text-anchor="middle" font-size="12" fill="#E0E7FF">BAAI/bge-small-en-v1.5</text>
  <text x="415" y="260" text-anchor="middle" font-size="12" fill="white" font-weight="600">→ captures abstract</text>
  <text x="415" y="278" text-anchor="middle" font-size="12" fill="white" font-weight="600">legal intent</text>

  <!-- Sparse embedding box -->
  <rect x="300" y="370" width="230" height="140" rx="14" fill="url(#sparseGrad)"/>
  <text x="415" y="402" text-anchor="middle" font-size="16" font-weight="700" fill="white">Learned Sparse (SPLADE)</text>
  <text x="415" y="426" text-anchor="middle" font-size="12" fill="#FFEDD5">Qdrant FastEmbed</text>
  <text x="415" y="444" text-anchor="middle" font-size="12" fill="#FFEDD5">Splade_PP_en_v1</text>
  <text x="415" y="470" text-anchor="middle" font-size="12" fill="white" font-weight="600">→ grounds exact article /</text>
  <text x="415" y="488" text-anchor="middle" font-size="12" fill="white" font-weight="600">statute terminology</text>

  <line x1="530" y1="230" x2="630" y2="260" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="440" x2="630" y2="300" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Qdrant box -->
  <rect x="630" y="150" width="260" height="260" rx="16" fill="url(#qdrantGrad)"/>
  <text x="760" y="188" text-anchor="middle" font-size="18" font-weight="700" fill="white">Qdrant</text>
  <text x="760" y="212" text-anchor="middle" font-size="13" fill="#D1FAE5">Multi-vector Collection</text>

  <rect x="655" y="230" width="210" height="42" rx="8" fill="rgba(255,255,255,0.18)"/>
  <text x="760" y="256" text-anchor="middle" font-size="13" fill="white">prefetch: dense (top-50)</text>

  <rect x="655" y="282" width="210" height="42" rx="8" fill="rgba(255,255,255,0.18)"/>
  <text x="760" y="308" text-anchor="middle" font-size="13" fill="white">prefetch: sparse (top-50)</text>

  <rect x="655" y="334" width="210" height="52" rx="8" fill="white"/>
  <text x="760" y="356" text-anchor="middle" font-size="13" fill="#065F46" font-weight="700">Reciprocal Rank Fusion</text>
  <text x="760" y="374" text-anchor="middle" font-size="11" fill="#065F46">(query_points, fusion=RRF)</text>

  <!-- Results -->
  <rect x="700" y="440" width="260" height="90" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="830" y="470" text-anchor="middle" font-size="14" font-weight="700" fill="#78350F">Ranked Results</text>
  <text x="830" y="490" text-anchor="middle" font-size="12" fill="#78350F">Article-level passages,</text>
  <text x="830" y="506" text-anchor="middle" font-size="12" fill="#78350F">ready for RAG / citation</text>

  <line x1="830" y1="410" x2="830" y2="440" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
